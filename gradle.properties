# ============================================================
# 墨阅 Android · Gradle 配置
#
# 说明：本机按用户要求把整个工具链放在 D 盘，不写入 C 盘。
# 如果你在自己的机器上构建，只需保证 JDK 17 可用；
# 下面的 sdk.dir / java.home 指向本机路径，可按需改成你自己的。
# ============================================================

# —— Android SDK 位置 ——
sdk.dir=D\:\\AndroidToolchain\\sdk

# —— 构建用的 JDK（AGP 8.x 要求 JDK 17）——
org.gradle.java.home=D\:\\AndroidToolchain\\jdk\\jdk-17.0.13+11

# —— 把 Gradle 的缓存与守护进程数据也放到 D 盘，避免占用 C 盘 ——
# （下面两项由命令行 -g 或环境变量 GRADLE_USER_HOME 覆盖，这里作为默认值）
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# 中文字体与编码：源码含大量中文注释，必须显式声明 UTF-8，
# 否则在中文 Windows（默认 GBK）上编译会报编码错误。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX 迁移开关（AGP 8 必需）
android.useAndroidX=true

# Kotlin 官方代码风格
kotlin.code.style=official

# 只为当前 ABI 打包，加快构建
android.nonTransitiveRClass=true
